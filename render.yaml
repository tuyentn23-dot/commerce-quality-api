services:
  - type: web
    name: commerce-quality-api
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: RAPIDAPI_PROXY_SECRET
        sync: false
      - key: ADMIN_TOKEN
        generateValue: true
      - key: METRICS_HASH_SECRET
        generateValue: true
      - key: METRICS_STORAGE_MODE
        value: ephemeral
